<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Little sheep meadow</title>
  <desc id="desc">Two cream and charcoal sheep graze among sage grass and coral flowers.</desc>

