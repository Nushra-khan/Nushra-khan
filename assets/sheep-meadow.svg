    <circle cx="510" cy="132" r="34" fill="#F3EEDC"/>
    <path d="M344 155 Q326 176 319 198" fill="none" stroke="#111613" stroke-width="15" stroke-linecap="round"/>
    <ellipse cx="308" cy="191" rx="31" ry="25" transform="rotate(-24 308 191)" fill="#111613"/>
    <path d="M294 175 L278 161 M321 175 L331 156" fill="none" stroke="#111613" stroke-width="8" stroke-linecap="round"/>
